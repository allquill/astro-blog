# The site's front door (the `website` compose service). Pages are rendered by the `web` container
# (Astro on Node) from the API's content; this nginx serves the built assets, proxies /api to the API,
# and keeps each rendered page for the few seconds the page itself asks for (X-Accel-Expires), so
# a burst of readers costs one render and a publish still shows within seconds.

# Rendered pages (small; a few seconds each) and resized images (immutable; kept a week).
proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:10m max_size=256m inactive=10m use_temp_path=off;
proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:10m max_size=2g inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;
    charset_types text/plain text/css text/xml application/xml application/rss+xml application/javascript application/json text/markdown;

    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/feed+json application/xml application/rss+xml image/svg+xml font/woff2;

    # Resolved at request time through Docker's DNS, so nginx starts (and serves what it can) while
    # `server` or `web` is down: their routes then answer 502.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://server:3002;
    set $web_upstream http://web:4321;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Uploaded images and their resized copies: immutable URLs, cached here and in browsers.
    location /api/public/media/ {
        proxy_pass $api_upstream;
        proxy_cache media;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        limit_except GET HEAD { deny all; }
        add_header X-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The API: likes, shares, subscribe and feedback forms (the content API is read by `web` directly).
    # Generated share cards: the path carries a key that changes with the post, so cache them like media.
    location /api/public/og/ {
        proxy_pass $api_upstream;
        proxy_cache media;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        limit_except GET HEAD { deny all; }
        add_header X-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass $api_upstream;
        # Forms only.
        client_max_body_size 64k;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fingerprinted build assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Confirm and manage-subscription pages are personal (token in the URL): never cached, never
    # indexed, and the token is not sent on to other sites.
    location ~ ^/subscribe/(confirm|manage)/ {
        proxy_pass $web_upstream;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Drafts from the admin (signed link): never cached; the page itself says noindex.
    location /preview/ {
        proxy_pass $web_upstream;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Files in public/ (favicon, logo) when they exist; everything else is a page.
    location / {
        try_files $uri @web;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location @web {
        proxy_pass $web_upstream;
        proxy_cache pages;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        # While a page is re-rendered (or `web` restarts), readers get the copy in hand.
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_read_timeout 30s;
        add_header X-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
