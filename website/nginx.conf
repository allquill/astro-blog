server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/plain text/css text/xml application/xml application/rss+xml application/javascript application/json text/markdown;

    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/xml application/rss+xml image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The API: the `server` compose service (server/). Resolved at request time through Docker's DNS
    # so nginx still starts (and serves the site) when the API isn't running — /api then answers 502.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://server:3002;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Forms only: subscribe, feedback, likes.
        client_max_body_size 64k;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Confirm and manage-subscription pages are personal (token in the URL): never cached by proxies,
    # never indexed, and the token is not sent on to other sites.
    location ~ ^/subscribe/(confirm|manage)/ {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ $uri.html =404;
    }

    # Fingerprinted build assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Plain-Markdown twins of posts (/blog/<id>.md) for AI agents. `.md` is not in
    # nginx's mime.types, so default_type applies (a `types {}` block here would replace the whole table).
    location ~* \.md$ {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Feeds: the API reads feed.json every few minutes; readers poll the others.
    location ~ ^/(feed\.json|rss\.xml|topics/[^/]+/rss\.xml)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
