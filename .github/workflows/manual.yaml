name: Manual build

# Human-triggered build from ANY branch -> pushes the four images tagged :manual.
# Select the branch in the "Run workflow" dropdown; that ref is what gets built.

on:
  workflow_dispatch:

concurrency:
  group: manual-build
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read package metadata
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Display project information
        run: |
          echo "Building ${{ steps.pkg.outputs.name }} v${{ steps.pkg.outputs.version }}"
          echo "from ref ${{ github.ref_name }} -> :manual"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Website (website/): two images from one Dockerfile. -web is the nginx front door (target edge),
      # -web-ssr the Astro server that renders pages from the API's content (target ssr). Nothing about the
      # content or the site URL is baked in.
      - name: Build and push website image (edge)
        uses: docker/build-push-action@v5
        with:
          context: ./website
          file: ./website/Dockerfile
          target: edge
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ steps.pkg.outputs.name }}-web:manual
          platforms: linux/amd64
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push website image (ssr)
        uses: docker/build-push-action@v5
        with:
          context: ./website
          file: ./website/Dockerfile
          target: ssr
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ steps.pkg.outputs.name }}-web-ssr:manual
          platforms: linux/amd64
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Admin app (admin/): same tags, image name suffixed with -admin.
      - name: Build and push admin image
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ steps.pkg.outputs.name }}-admin:manual
          platforms: linux/amd64
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin


      # API (server/): same tags, image name suffixed with -api.
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          build-contexts: |
            docs=./docs
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ steps.pkg.outputs.name }}-api:manual
          platforms: linux/amd64
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
