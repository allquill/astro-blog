# Astro Blog: website + admin app (both nginx) in front of the NestJS API — PREBUILT images.
#
#   website      nginx :80 — the public site's front door: assets, /api to `server`, pages from `web` → ${WEBSITE_PORT}
#   web          Node :4321 — renders the site's pages on request from the content in `server`
#   admin        nginx :80 — the staff admin app (editing posts, topics, authors, pages, …); /api to `server` → ${ADMIN_PORT}
#   server       Node: the content and images, likes, shares, subscribers, feedback, e-mail, the staff docs.
#                Not published on the host; reached through the nginx containers and `web`. Settings: ./.env.
#   postgres     (optional, profile "postgres") — set DATABASE_TYPE=postgres + DATABASE_* in ./.env
#   cloudflared  (optional, profile "cloudflare") — Cloudflare Tunnel; set CLOUDFLARE_TUNNEL_TOKEN in ./.env
#   mailpit      (optional, profile "mail") local SMTP catcher for testing e-mails: http://localhost:8025
#
# Networks — only the website and admin (and mailpit's inbox, when on) are published on the host:
#   frontend  website, admin, cloudflared, mailpit   host ports and the tunnel; the API is NOT on it
#   backend   website, web, admin, server, postgres, mailpit   internal (no internet): /api, pages, the database, SMTP
#   egress    server                                  outbound only (SMTP provider); nothing reaches in
# So cloudflared or anything published can reach only the two nginx containers, never `web`, the API
# or the database, and postgres has no internet access at all.
#
# Two compose files, same services, same project name (so they share containers and data):
#   docker-compose.yml        THIS file: runs the images CI pushed to ${AB_REGISTRY}, tag ${AB_TAG}
#   docker-compose-build.yml  builds the four images from this checkout instead (pnpm run compose:build)
#
# Run from this folder:
#     cp env.example .env                     # once; then fill it in
#     docker compose pull && docker compose up -d
#     docker compose --profile postgres --profile cloudflare up -d    # with optional services
# or from the project root: pnpm run compose:up / compose:down / compose:logs
#
# Nothing is baked into the images: content lives in the API's database, and the site's URL
# (PUBLIC_SITE_URL) and GA_MEASUREMENT_ID are read from ./.env at start-up. Publishing a post needs no
# build or restart. CI publishes linux/amd64 images; on Apple silicon Docker runs them under emulation.
#
# Behind a reverse proxy / cloudflared, publish the website and admin on their own hostnames and set
# PUBLIC_SITE_URL and ADMIN_URL in ./.env to match (links in pages, feeds and e-mails).
name: astro-blog

services:
  website:
    image: ${AB_REGISTRY:+${AB_REGISTRY}/}astro-blog-web:${AB_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEBSITE_PORT:-8093}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/favicon.svg || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [frontend, backend]
    depends_on:
      - web
      - server

  web:
    image: ${AB_REGISTRY:+${AB_REGISTRY}/}astro-blog-web-ssr:${AB_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      # The public URL of the site (canonical/OG links, sitemap, feeds): the same as the API's.
      SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8093}
      API_INTERNAL_URL: http://server:3002
      # GA4 measurement ID (G-…). Empty = no analytics code.
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      # How often (ms) the site checks the API for new content.
      CONTENT_POLL_MS: ${CONTENT_POLL_MS:-5000}
    # backend only: it is reached by `website` and reaches `server`. No host ports, no internet.
    networks: [backend]
    depends_on:
      - server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4321/robots.txt >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  admin:
    image: ${AB_REGISTRY:+${AB_REGISTRY}/}astro-blog-admin:${AB_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-8094}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [frontend, backend]
    depends_on:
      - server

  server:
    image: ${AB_REGISTRY:+${AB_REGISTRY}/}astro-blog-api:${AB_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      # ./.env (docker/.env, from env.example). Optional so `docker compose` works before it exists; the
      # server then exits with a message listing the missing settings.
      - path: .env
        required: false
    environment:
      # Wiring owned by this file; overrides .env.
      PORT: "3002"
      DATABASE_PATH: /data/astro-blog.db
      MEDIA_DIR: /data/media
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-real-ip}
    volumes:
      # SQLite database and uploaded images (media/), kept on the host in <DOCKER_VOLUME_FOLDER>/server. The default
      # ./volumes is relative to this folder (docker/volumes). On Linux the folder must be writable by the
      # container's user, uid 1000 (`sudo chown -R 1000:1000 <folder>`). Back it up.
      - ${DOCKER_VOLUME_FOLDER:-./volumes}/server:/data
    # backend: reached by the nginx containers and `web`, reaches postgres / mailpit.
    # egress: outbound to the SMTP provider. No host ports.
    networks: [backend, egress]
    depends_on:
      # Only when the "postgres" profile is on: wait until it accepts connections, so the first start
      # doesn't fail its migrations. Without the profile this is skipped (SQLite).
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-astroblog}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-astroblog}
      POSTGRES_DB: ${DATABASE_NAME:-astroblog}
    volumes:
      - ${DOCKER_VOLUME_FOLDER:-./volumes}/postgres:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cloudflare Tunnel: publishes the site and the admin without opening host ports. In the Cloudflare
  # dashboard, route the public hostname to http://website:80 and the admin hostname to http://admin:80.
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.10.3}
    profiles: ["cloudflare"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    # frontend only: it can reach website and admin, not the API or the database.
    networks: [frontend]
    depends_on:
      - website
      - admin

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    restart: unless-stopped
    # Only the inbox is published; the API sends to mailpit:1025 over the backend network.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_PORT:-8025}:8025"
    networks: [frontend, backend]

networks:
  frontend:
  backend:
    internal: true
  egress:
